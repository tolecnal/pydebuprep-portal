# The portal and its PostgreSQL. Put the settings in .env (see .env.example), then:
#   docker compose up -d
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  portal:
    # The released image; `docker compose build` (or `up --build`) builds it from source.
    image: ghcr.io/tolecnal/pydebuprep-portal:${PORTAL_VERSION:-0.4.0}
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: ${PORTAL_ENV_FILE:-.env}
    environment:
      PORTAL_DATABASE_URL: postgresql+psycopg://portal:${POSTGRES_PASSWORD}@db:5432/portal
    # Only the reverse proxy on this machine reaches the portal; it terminates TLS.
    # (PORTAL_BIND=0.0.0.0 publishes it on every interface, for a preview.)
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  # PostgreSQL 18 keeps its data under /var/lib/postgresql/18/. Portals from before 0.4.0
  # ran PostgreSQL 17 in the volume "db": scripts/upgrade-postgres-18.sh moves the
  # database over and leaves that volume as it was.
  postgres18: {}
