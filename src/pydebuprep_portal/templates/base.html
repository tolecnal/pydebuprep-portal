<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}pydebuprep portal{% endblock %}</title>
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0}'>
<link rel="stylesheet" href="/static/portal.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">pydebuprep portal</a>
  {% if viewer %}
  <nav>
    <a href="/">Reports</a>
    <a href="/hosts">Hosts</a>
    <a href="/search">Search</a>
    {% if viewer.reads_all %}<a href="/tokens">Tokens</a>{% endif %}
  </nav>
  <div class="who">
    <span class="name">{{ viewer.name }}</span>
    {% for role in viewer.roles | sort %}<span class="role">{{ role }}</span>{% endfor %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
      <button type="submit">Sign out</button>
    </form>
  </div>
  {% endif %}
</header>
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>
