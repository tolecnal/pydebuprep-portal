{% extends "base.html" %}
{% block main %}
<h1>Reports</h1>
<form class="filters" method="get" action="/" hx-get="/" hx-target="#rows" hx-trigger="change" hx-push-url="true">
  <label>Worst
    <select name="worst">
      <option value="">any</option>
      {% for level in ["critical", "warning", "info", "ok"] %}
      <option value="{{ level }}"{% if worst == level %} selected{% endif %}>{{ level }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Team
    <select name="team">
      <option value="">any</option>
      {% if viewer.reads_all %}<option value="unassigned"{% if team == "unassigned" %} selected{% endif %}>unassigned</option>{% endif %}
      {% for name in teams %}<option value="{{ name }}"{% if team == name %} selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
  </label>
  {% if viewer.is_admin %}<label><input type="checkbox" name="flagged" value="1"{% if flagged %} checked{% endif %}> Sent with another team's token</label>{% endif %}
  <button type="submit">Filter</button>
</form>
<div id="rows">
{% include "_report_rows.html" %}
</div>
{% endblock %}
