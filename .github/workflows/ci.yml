name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal_test
          POSTGRES_PASSWORD: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_test" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      PORTAL_TEST_DATABASE_URL: postgresql+psycopg://portal_test:portal_test@127.0.0.1:5432/portal_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - run: make lint test PYTHON=python

  image:
    name: Docker image and end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install the pinned pydebuprep CLI
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Build, run with compose, upload with pydebuprep, check what was stored
        env:
          PYTHON: python
        run: scripts/smoke.sh
